<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | LV Tour & Travels</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo"><i class="fa-solid fa-plane-departure"></i> LV Tours</div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="packages.html">Packages</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
    <div class="menu-toggle" id="menuToggle">
      <i class="fa-solid fa-bars"></i>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <h1>Contact & Booking</h1>
    <p>Reach out to plan your upcoming dream trip.</p>
  </header>

  <!-- Contact Form Section -->
  <section class="container">
    <div class="contact-wrapper">
      <div class="contact-info">
        <h3>Get in Touch</h3>
        <p><i class="fa-solid fa-location-dot"></i> 123 Travel Avenue, Suite 400, City, Country</p>
        <p><i class="fa-solid fa-phone"></i> +1 (800) 555-0199</p>
        <p><i class="fa-solid fa-envelope"></i> info@lvtours.com</p>
      </div>

      <form class="contact-form" id="contactForm">
        <h3>Book or Inquire</h3>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label for="message">Your Message / Booking Request</label>
          <textarea id="message" rows="5" required placeholder="Tell us about your trip plans..."></textarea>
        </div>
        <button type="submit" class="btn">Send Inquiry</button>
        <p id="formFeedback" class="feedback-msg"></p>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 LV Tour & Travels. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
